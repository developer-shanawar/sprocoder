<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#09090b" stroke="#f97316" stroke-width="12"/>
  <circle cx="250" cy="250" r="225" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="6,6"/>
  
  <!-- Coder Character Head & Body -->
  <g id="avatar">
    <!-- Hair background -->
    <path d="M 170 180 Q 250 100 330 180 Q 350 140 310 110 Q 250 80 190 110 Q 150 140 170 180 Z" fill="#18181b"/>
    <!-- Face -->
    <ellipse cx="250" cy="220" rx="65" ry="75" fill="#fde047" opacity="0.9"/>
    <!-- Glasses -->
    <rect x="195" y="195" width="45" height="30" rx="8" fill="none" stroke="#09090b" stroke-width="6"/>
    <rect x="260" y="195" width="45" height="30" rx="8" fill="none" stroke="#09090b" stroke-width="6"/>
    <line x1="240" y1="210" x2="260" y2="210" stroke="#09090b" stroke-width="6"/>
    <!-- Eyes -->
    <circle cx="217" cy="210" r="6" fill="#09090b"/>
    <circle cx="283" cy="210" r="6" fill="#09090b"/>
    <!-- Smile -->
    <path d="M 225 250 Q 250 270 275 250" fill="none" stroke="#09090b" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Hoodie -->
    <path d="M 140 380 Q 250 310 360 380 L 380 440 Q 250 460 120 440 Z" fill="#18181b"/>
    <!-- Hoodie trim -->
    <path d="M 140 380 Q 250 310 360 380" fill="none" stroke="#f97316" stroke-width="6"/>
    
    <!-- Coding Symbols on Chest: </> -->
    <text x="250" y="385" font-family="monospace" font-weight="900" font-size="44" fill="#f97316" text-anchor="middle">&lt;/&gt;</text>
  </g>
  
  <!-- Text Branding: S PRO CODER -->
  <text x="250" y="425" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    <tspan fill="#f97316">S </tspan>PRO
  </text>
  <line x1="140" y1="445" x2="200" y2="445" stroke="#f97316" stroke-width="3"/>
  <text x="250" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#e4e4e7" text-anchor="middle" letter-spacing="8">CODER</text>
  <line x1="300" y1="445" x2="360" y2="445" stroke="#f97316" stroke-width="3"/>
</svg>
